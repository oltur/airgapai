# What ingestion and retrieval need through the default deny, and nothing more: the ingestion Job and
# the retrieval service reach PostgreSQL and the embedding server, and nothing else reaches either.
# Nothing may call the retrieval service yet. The rules match the app label, so any pod in the
# retrieval namespace that carries app=ingest or app=retrieval gets the same paths.
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: retrieval-workloads-egress
spec:
  selector: app in {"ingest", "retrieval"}
  namespaceSelector: kubernetes.io/metadata.name == "retrieval"
  types:
    - Egress
  egress:
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "retrieval"
        selector: app == "postgres"
        ports: [5432]
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "inference"
        selector: app == "embed"
        ports: [8080]
---
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: postgres-reachable
spec:
  selector: app == "postgres"
  namespaceSelector: kubernetes.io/metadata.name == "retrieval"
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name == "retrieval"
        selector: app in {"ingest", "retrieval"}
      destination:
        ports: [5432]
---
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: embed-reachable
spec:
  selector: app == "embed"
  namespaceSelector: kubernetes.io/metadata.name == "inference"
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name == "retrieval"
        selector: app in {"ingest", "retrieval"}
      destination:
        ports: [8080]
